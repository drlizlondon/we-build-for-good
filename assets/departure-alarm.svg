<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2f9b" />
      <stop offset="50%" stop-color="#7a19c9" />
      <stop offset="100%" stop-color="#24002f" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8ae" />
      <stop offset="50%" stop-color="#ffd83e" />
      <stop offset="100%" stop-color="#f3a600" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  <g filter="url(#shadow)">
    <!-- Alarm clock feet -->
    <path d="M 120 400 L 80 440" stroke="#ffd83e" stroke-width="24" stroke-linecap="round" />
    <path d="M 392 400 L 432 440" stroke="#ffd83e" stroke-width="24" stroke-linecap="round" />
    <!-- Alarm bells -->
    <path d="M 110 130 C 130 90 190 110 170 150 Z" fill="url(#gold)" />
    <path d="M 402 130 C 382 90 322 110 342 150 Z" fill="url(#gold)" />
    <!-- Clock body -->
    <circle cx="256" cy="280" r="150" fill="#2d0042" stroke="url(#gold)" stroke-width="22" />
    <!-- Clock dial ring -->
    <circle cx="256" cy="280" r="120" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="6" stroke-dasharray="4 20" />
    <!-- Clock hands pointing to departure -->
    <line x1="256" y1="280" x2="256" y2="185" stroke="#ffffff" stroke-width="16" stroke-linecap="round" />
    <line x1="256" y1="280" x2="320" y2="240" stroke="#ff2f9b" stroke-width="12" stroke-linecap="round" />
    <circle cx="256" cy="280" r="16" fill="#ffd83e" />
  </g>
  <!-- Rocket speed spark -->
  <polygon points="400,90 420,120 450,110 430,135 445,160 415,145 395,170 395,135 370,125 395,115" fill="#ffd83e" opacity="0.9" />
</svg>
